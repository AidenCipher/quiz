name: CI
on:
  pull_request:
  push:
    branches: [main, staging]
    # Documentation-only pushes need no test run and must not trigger a production deploy.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @quiz/shared test
      - run: pnpm --filter @quiz/web build
      - run: pnpm --filter @quiz/web test
      - run: pnpm --filter @quiz/worker test

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quiz/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-site-config.mjs
        env:
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          VITE_OPERATOR_COUNTRY: ${{ vars.OPERATOR_COUNTRY }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - run: pnpm --filter @quiz/web build
        env:
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          VITE_OPERATOR_COUNTRY: ${{ vars.OPERATOR_COUNTRY }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - run: pnpm --filter @quiz/worker exec wrangler d1 migrations apply quiz-arena-staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter @quiz/worker exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-site-config.mjs
        env:
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          VITE_OPERATOR_COUNTRY: ${{ vars.OPERATOR_COUNTRY }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - run: pnpm --filter @quiz/web build
        env:
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          VITE_OPERATOR_COUNTRY: ${{ vars.OPERATOR_COUNTRY }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - run: pnpm --filter @quiz/worker exec wrangler d1 migrations apply quiz-arena --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter @quiz/worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
